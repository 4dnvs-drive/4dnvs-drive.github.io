
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080f17">
  <title>Waymo Results — DrivENVS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080f17;
      --surface: #0e1924;
      --line: #2b3b4a;
      --text: #edf4f8;
      --muted: #9bafbf;
      --accent: #2e95ca;
      --brand: linear-gradient(90deg, #5de0e6, #004aad);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .container {
      width: min(1200px, calc(100% - 64px));
      margin: auto;
    }

    /* MINIMAL HEADER */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 27px 0;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font: 1.85rem/1 Anton, Impact, sans-serif;
      background: var(--brand);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .switch {
      font-size: .85rem;
      color: var(--muted);
    }

    .switch:hover {
      color: var(--accent);
    }

    /* TITLE */

    .intro {
      padding: 66px 0 42px;
    }

    .intro h1 {
      font-size: clamp(3.8rem, 8vw, 7rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -.07em;
      margin: 0 0 13px;
    }

    .intro p {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.6;
      margin: 0;
    }

    /* FILTERS */

    .filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .filter-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .filter-name {
      color: var(--muted);
      font-size: .85rem;
      margin-right: 10px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid #364b5d;
      color: #bbccd8;
      padding: 9px 15px;
      font-size: .84rem;
      transition: border-color .18s, background .18s;
    }

    .filter-btn:hover {
      border-color: var(--accent);
    }

    .filter-btn[aria-pressed="true"] {
      background: #17364b;
      border-color: var(--accent);
      color: #e4f0f6;
    }

    .count {
      color: var(--muted);
      font-size: .8rem;
      margin-left: auto;
      white-space: nowrap;
    }

    /* VIDEO COMPARISON BLOCKS */

    .gallery {
      display: grid;
      gap: 30px;
      padding: 38px 0 100px;
    }

    .pair {
      background: var(--surface);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .pair-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px 20px;
      padding: 21px 24px;
    }

    .pair-heading h2 {
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      font-weight: 500;
      line-height: 1.5;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .pair-heading span {
      color: #91afc2;
      font-size: .8rem;
    }

    .videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
    }

    .video-box {
      min-width: 0;
      background: #060b11;
    }

    .video-label {
      padding: 11px 16px;
      font-size: .82rem;
      background: #101d29;
      color: #c8d5de;
    }

    .video-label.output {
      color: #6db0d1;
    }

    .video-box video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #03080e;
    }

    .video-error {
      display: none;
      margin: 0;
      padding: 10px 16px;
      color: #edb8b8;
      font-size: .78rem;
    }

    .video-box.failed .video-error {
      display: block;
    }

    /* FOOTER */

    .footer {
      padding: 30px 0 55px;
      border-top: 1px solid var(--line);
    }

    .footer a {
      color: var(--muted);
      font-size: .86rem;
    }

    .footer a:hover {
      color: var(--accent);
    }

    /* RESPONSIVE */

    @media (max-width: 760px) {
      .container {
        width: calc(100% - 32px);
      }

      .intro {
        padding: 48px 0 35px;
      }

      .filters {
        gap: 16px;
      }

      .filter-name {
        width: 75px;
      }

      .count {
        width: 100%;
        margin: 0;
      }

      .gallery {
        padding-top: 24px;
        gap: 22px;
      }

      .videos {
        grid-template-columns: 1fr;
      }

      .pair-heading {
        padding: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="topbar">
      <a class="wordmark" href="../index.html">
        DrivENVS
      </a>

      <a class="switch" href="../nuscenes/index.html">
        View nuScenes ↗
      </a>
    </header>

    <main>

      <section class="intro">
        <h1>Waymo</h1>
        <p>Input and synthesized views, side by side.</p>
      </section>

      <div class="filters" aria-label="Video filters">

        <div class="filter-group">
          <span class="filter-name">Distance</span>

          <button class="filter-btn"
                  data-distance="1m"
                  type="button">1 m</button>

          <button class="filter-btn"
                  data-distance="2m"
                  type="button">2 m</button>
        </div>

        <div class="filter-group">
          <span class="filter-name">Direction</span>

          <button class="filter-btn"
                  data-direction="ALL"
                  type="button">All</button>

          <button class="filter-btn"
                  data-direction="L"
                  type="button">Left</button>

          <button class="filter-btn"
                  data-direction="R"
                  type="button">Right</button>

          <button class="filter-btn"
                  data-direction="U"
                  type="button">Up</button>
        </div>

        <span class="count" id="count"></span>

      </div>

      <section
        class="gallery"
        id="gallery"
        aria-label="Waymo video comparisons">
      </section>

    </main>

    <footer class="footer">
      <a href="../index.html">
        ← Back to DrivENVS
      </a>
    </footer>

  </div>

  <script>
    // These identifiers correspond to the original Waymo files.
    // Example filename:
    // L2M_2709541197299883157_1140_000_1160_000_input.mp4

    const DATA = {
      "1m": {
        L: [
          "2709541197299883157_1140_000_1160_000",
          "3485136235103477552_600_000_620_000",
          "6278307160249415497_1700_000_1720_000"
        ],

        R: [
          "1376304843325714018_3420_000_3440_000",
          "2795127582672852315_4140_000_4160_000",
          "3400465735719851775_1400_000_1420_000",
          "2257381802419655779_820_000_840_000"
        ],

        U: [
          "10488772413132920574_680_000_700_000",
          "1735154401471216485_440_000_460_000",
          "6228701001600487900_720_000_740_000"
        ]
      },

      "2m": {
        L: [
          "1664548685643064400_2240_000_2260_000",
          "3341890853207909601_1020_000_1040_000",
          "13732041959462600641_720_000_740_000"
        ],

        R: [
          "5648007586817904385_3220_000_3240_000",
          "2383902674438058857_4420_000_4440_000",
          "4037952268810331899_2420_000_2440_000"
        ],

        U: [
          "3459095437766396887_1600_000_1620_000",
          "10488772413132920574_680_000_700_000",
          "13732041959462600641_720_000_740_000"
        ]
      }
    };

    const params = new URLSearchParams(location.search);

    let distance = params.get("distance") === "2m"
      ? "2m" : "1m";

    let direction =
      ["ALL", "L", "R", "U"].includes(params.get("direction"))
        ? params.get("direction")
        : "ALL";

    const gallery = document.getElementById("gallery");
    const count = document.getElementById("count");

    const directions = {
      L: "Left",
      R: "Right",
      U: "Up"
    };

    // Convert original Waymo identifiers into readable scene labels.
    function getSceneLabel(value) {
      const match = value.match(
        /^(.+?)_(\d+)_000_(\d+)_000$/
      );

      if (!match) return value;

      return `${match[1]} · ${match[2]}–${match[3]}`;
    }

    // Lazy video loading
    const observer = "IntersectionObserver" in window
      ? new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;

            const video = entry.target;

            video.src = video.dataset.src;
            video.load();

            observer.unobserve(video);
          });
        }, {
          rootMargin: "450px 0px"
        })
      : null;

    // Synchronize input and output videos.
    function synchronizePair(a, b) {
      let updating = false;
      let leading = a;

      for (const [video, other] of [[a, b], [b, a]]) {

        video.addEventListener("play", () => {
          leading = video;

          if (updating) return;

          updating = true;

          if (
            other.readyState >= 1 &&
            Math.abs(video.currentTime - other.currentTime) > .12
          ) {
            other.currentTime = video.currentTime;
          }

          if (other.paused) {
            other.play().catch(() => {});
          }

          updating = false;
        });

        video.addEventListener("pause", () => {
          if (updating) return;

          updating = true;

          if (!other.paused) {
            other.pause();
          }

          updating = false;
        });

        video.addEventListener("seeking", () => {
          if (updating || other.readyState < 1) return;

          if (
            Math.abs(video.currentTime - other.currentTime) < .10
          ) return;

          updating = true;

          try {
            other.currentTime = video.currentTime;
          } catch (error) {}

          updating = false;
        });

        video.addEventListener("timeupdate", () => {
          if (
            video !== leading ||
            video.paused ||
            other.readyState < 1 ||
            updating
          ) return;

          if (
            Math.abs(video.currentTime - other.currentTime) > .25
          ) {
            updating = true;

            try {
              other.currentTime = video.currentTime;
            } catch (error) {}

            updating = false;
          }
        });

        video.addEventListener("ended", () => {
          other.pause();
        });
      }
    }

    function render() {
      // Stop old videos before changing filters.
      gallery.querySelectorAll("video").forEach(video => {
        video.pause();
        observer?.unobserve(video);
      });

      gallery.replaceChildren();

      const activeDirections = direction === "ALL"
        ? ["L", "R", "U"]
        : [direction];

      const clips = activeDirections.flatMap(dir =>
        DATA[distance][dir].map(scene => ({
          dir,
          scene
        }))
      );

      count.textContent = `${clips.length} comparisons`;

      document.querySelectorAll("[data-distance]")
        .forEach(button => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.distance === distance)
          );
        });

      document.querySelectorAll("[data-direction]")
        .forEach(button => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.direction === direction)
          );
        });

      clips.forEach((clip, index) => {
        const article = document.createElement("article");
        article.className = "pair";

        const heading = document.createElement("div");
        heading.className = "pair-heading";

        const title = document.createElement("h2");
        title.textContent = getSceneLabel(clip.scene);

        const meta = document.createElement("span");
        meta.textContent =
          `${directions[clip.dir]} · ${distance.toUpperCase()} ` +
          `· ${String(index + 1).padStart(2, "0")}`;

        heading.append(title, meta);

        const videos = document.createElement("div");
        videos.className = "videos";

        const players = [];

        for (const [folder, label] of [
          ["input", "Input"],
          ["output", "DrivENVS"]
        ]) {
          const panel = document.createElement("div");
          panel.className = "video-box";

          const videoLabel = document.createElement("div");
          videoLabel.className =
            "video-label" + (folder === "output" ? " output" : "");

          videoLabel.textContent = label;

          const video = document.createElement("video");
          video.controls = true;
          video.muted = true;
          video.playsInline = true;
          video.preload = "none";

          const stem = `${clip.dir}2M_${clip.scene}`;

          video.dataset.src =
            `videos/${distance}/${clip.dir}_${folder}/` +
            `${stem}_${folder}.mp4`;

          const errorText = document.createElement("p");
          errorText.className = "video-error";
          errorText.textContent =
            "Video not found. Please check its path.";

          video.addEventListener("error", () => {
            panel.classList.add("failed");
          });

          panel.append(videoLabel, video, errorText);
          videos.append(panel);
          players.push(video);

          if (observer) {
            observer.observe(video);
          } else {
            video.src = video.dataset.src;
            video.load();
          }
        }

        synchronizePair(players[0], players[1]);

        article.append(heading, videos);
        gallery.append(article);
      });

      const url = new URL(location.href);

      url.searchParams.set("distance", distance);
      url.searchParams.set("direction", direction);

      history.replaceState(null, "", url);
    }

    document.querySelectorAll("[data-distance]")
      .forEach(button => {
        button.addEventListener("click", () => {
          distance = button.dataset.distance;
          render();
        });
      });

    document.querySelectorAll("[data-direction]")
      .forEach(button => {
        button.addEventListener("click", () => {
          direction = button.dataset.direction;
          render();
        });
      });

    render();
  </script>
</body>
</html>
